name: Contact smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contact-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Send production contact test
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            -X POST 'https://juplifestudio.com/api/contact' \
            -H 'Origin: https://juplifestudio.com' \
            -H 'Content-Type: application/json' \
            --data '{"name":"JUP LIFE Production Test","email":"dee@juplifestudio.com","phone":"","interest":"Website contact test","message":"Production smoke test after Resend key refresh. Please confirm both the inquiry notification and the branded customer auto-reply arrive.","website":""}')
          echo "$response"
          echo "$response" | grep -q '"ok":true'
